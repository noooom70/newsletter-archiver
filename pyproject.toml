[tool.poetry]
name = "newsletter-archiver"
version = "0.1.0"
description = "CLI tool to archive email newsletters from Outlook with AI-powered search"
authors = ["Dan Newman"]
readme = "README.md"
packages = [{include = "newsletter_archiver", from = "src"}]

[tool.poetry.scripts]
newsletter-archiver = "newsletter_archiver.cli.main:app"

[tool.poetry.dependencies]
python = "^3.11"
typer = {extras = ["all"], version = "^0.15"}
rich = "^13.0"
msal = "^1.28"
requests = "^2.31"
beautifulsoup4 = "^4.12"
markdownify = "^0.14"
sqlalchemy = "^2.0"
pydantic-settings = "^2.0"
python-dotenv = "^1.0"
pyyaml = "^6.0.3"
sentence-transformers = {version = "^3.0", optional = true}
numpy = {version = "^1.26", optional = true}
anthropic = {version = "^0.79.0", optional = true}

[tool.poetry.extras]
rag = ["sentence-transformers", "numpy", "anthropic"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-cov = "^6.0"
ruff = "^0.9"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
